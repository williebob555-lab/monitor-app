syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

import "google/protobuf/timestamp.proto";
import "monitor/v1/common.proto";
import "monitor/v1/enrollment.proto";

service PeerPairingService {
  rpc Pair(stream PairingFrame) returns (stream PairingFrame);
}

// Additive in v1: resolves a one-time, short-lived typed pairing code to the desktop identity.
// The phone never sends the code itself (only a PBKDF2-derived lookup id) and verifies the
// returned proof, so neither a passive observer nor an impostor listener can use the exchange.
service PeerPairingCodeService {
  rpc Redeem(RedeemPairingCodeRequest) returns (RedeemPairingCodeResponse);
}

service PeerService {
  rpc PeerSession(stream PeerSessionRequest) returns (stream PeerSessionResponse);
}

message DiscoveryHint {
  string host = 1;
  uint32 port = 2;
  string expected_peer_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message RedeemPairingCodeRequest {
  ProtocolVersion protocol_version = 1;
  // 16 bytes derived from the typed code; never the code.
  bytes lookup_id = 2;
}

message RedeemPairingCodeResponse {
  string peer_id = 1;
  bytes public_key_sha256 = 2;
  // HMAC-SHA256 under a key derived from the typed code over lookup id, peer id and fingerprint.
  bytes proof = 3;
}

message CompatibilityFailure {
  ProtocolCompatibility supported = 1;
  ProtocolVersion received = 2;
  string safe_message = 3;
}

message PairingHello {
  ProtocolVersion protocol_version = 1;
  string pairing_id = 2;
  string peer_id = 3;
  string display_name = 4;
  bytes public_key_spki = 5;
  bytes public_key_sha256 = 6;
}

message PeerChallenge {
  string session_id = 1;
  string challenge_id = 2;
  string challenger_peer_id = 3;
  string challenged_peer_id = 4;
  bytes proof_challenge = 5;
  SignatureAlgorithm signature_algorithm = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message PeerProof {
  string session_id = 1;
  string challenge_id = 2;
  string signer_peer_id = 3;
  string verifier_peer_id = 4;
  SignatureAlgorithm signature_algorithm = 5;
  bytes proof_signature = 6;
}

message PairingConfirmation {
  string pairing_id = 1;
  string local_peer_id = 2;
  string remote_peer_id = 3;
  bytes remote_public_key_sha256 = 4;
  google.protobuf.Timestamp paired_at = 5;
}

enum PairingApprovalDisposition {
  PAIRING_APPROVAL_DISPOSITION_UNSPECIFIED = 0;
  PAIRING_APPROVAL_DISPOSITION_AWAITING_LOCAL_APPROVAL = 1;
  PAIRING_APPROVAL_DISPOSITION_APPROVED = 2;
  PAIRING_APPROVAL_DISPOSITION_REJECTED = 3;
  PAIRING_APPROVAL_DISPOSITION_EXPIRED = 4;
  PAIRING_APPROVAL_DISPOSITION_COMPLETED = 5;
}

message PairingApproval {
  string pairing_id = 1;
  PairingApprovalDisposition disposition = 2;
  google.protobuf.Timestamp expires_at = 3;
  string safe_message = 4;
}

message PairingFrame {
  oneof message {
    PairingHello hello = 1;
    PeerChallenge challenge = 2;
    PeerProof proof = 3;
    PairingConfirmation confirmation = 4;
    CompatibilityFailure incompatibility = 5;
    ProtocolError error = 6;
    PairingApproval approval = 7;
  }
}

message CapabilityDescriptor {
  string module_id = 1;
  string module_version = 2;
  bytes declaration_sha256 = 3;
}

message OriginCursor {
  string origin_peer_id = 1;
  string origin_stream_id = 2;
  uint64 accepted_through_sequence = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message PeerHello {
  ProtocolVersion protocol_version = 1;
  string peer_id = 2;
  bytes public_key_sha256 = 3;
  string session_id = 4;
  repeated CapabilityDescriptor capabilities = 5;
  repeated OriginCursor cursors = 6;
}

message CapabilityExchange {
  repeated CapabilityDescriptor capabilities = 1;
}

message OriginRangeRequest {
  string request_id = 1;
  string origin_peer_id = 2;
  string origin_stream_id = 3;
  uint64 first_sequence = 4;
  uint64 last_sequence = 5;
  uint32 maximum_record_count = 6;
  uint32 maximum_batch_bytes = 7;
}

message OriginRecord {
  string origin_peer_id = 1;
  string origin_stream_id = 2;
  uint64 sequence = 3;
  string subject_entity_id = 4;
  string capability_id = 5;
  string signal_id = 6;
  bytes record_bytes = 7;
  bytes content_sha256 = 8;
  bytes origin_signature = 9;
  google.protobuf.Timestamp observed_at = 10;
  ObservationQuality quality = 11;
  SignatureAlgorithm signature_algorithm = 12;
}

message OriginRecordBatch {
  string request_id = 1;
  repeated OriginRecord records = 2;
  bool has_more = 3;
  // Pushed batches only: the range immediately before the first record (or the whole batch, when it has no
  // records) was removed by the sender's retention. Receivers record it as intentionally absent and resume after it.
  PrunedRange pruned_range = 4;
}

message OriginAck {
  OriginCursor cursor = 1;
}

message PeerHeartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

// Live session extensions (additive). A peer opts a held-open session into live origin push and live interest
// with LiveSubscribe; origin data still travels as OriginRecordBatch/OriginAck over the same signed, idempotent
// per-origin replication, so cursors and gaps stay authoritative.
message LiveSubscribe {
  bool push_origin = 1;
  bool push_interests = 2;
  uint32 maximum_in_flight_batches = 3;
}

message LiveSubscribeAck {
  bool accepted = 1;
  uint32 maximum_in_flight_batches = 2;
  string safe_message = 3;
}

// Declares that the sender is viewing subject_peer_id's signals. The receiver honours it only for its own origin,
// only from an actively trusted authenticated peer, and only until the lease expires. lease_seconds == 0 withdraws.
// relay_hops_remaining (additive; absent/0 on older peers) lets the sender ask a trusted relay to pass the interest to
// subject_peer_id over the relay's own session with it: the relay accepts only 1, forwards only to the subject itself
// (never to a third peer), only while this lease is alive, and always forwards with 0 so it is never relayed again.
// With 0, interest in a subject other than the receiver is refused.
message LiveInterest {
  string subject_peer_id = 1;
  repeated string signal_ids = 2;
  uint32 lease_seconds = 3;
  uint32 relay_hops_remaining = 4;
}

message LiveInterestAck {
  string subject_peer_id = 1;
  bool accepted = 2;
  uint32 granted_lease_seconds = 3;
  uint32 sampling_interval_milliseconds = 4;
  string safe_message = 5;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_INFO = 1;
  ALERT_SEVERITY_WARNING = 2;
  ALERT_SEVERITY_CRITICAL = 3;
}

enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  ALERT_STATE_RAISED = 1;
  ALERT_STATE_RESOLVED = 2;
}

// One alert episode at one revision (1 = raised, 2 = resolved). Owned by origin_peer_id; recipients only
// display and acknowledge it, they never re-evaluate it.
message AlertRecord {
  uint32 schema_version = 1;
  string alert_id = 2;
  uint32 revision = 3;
  string rule_id = 4;
  string subject_id = 5;
  string origin_peer_id = 6;
  AlertSeverity severity = 7;
  AlertState state = 8;
  string title = 9;
  string detail = 10;
  google.protobuf.Timestamp raised_at = 11;
  google.protobuf.Timestamp resolved_at = 12;
  // True when this delivery is the one-time escalation of a still-raised, unacknowledged Critical alert (T051).
  bool escalated = 13;
  reserved 14 to 20;
}

// Sent by an authenticated trusted peer to receive alerts addressed to it.
message AlertPull {
  string request_id = 1;
  uint32 maximum_count = 2;
  reserved 3 to 8;
}

message AlertBatch {
  string request_id = 1;
  repeated AlertRecord alerts = 2;
  bool has_more = 3;
  reserved 4 to 8;
}

message AlertAckEntry {
  string alert_id = 1;
  uint32 revision = 2;
  // Acknowledges an escalated delivery (AlertRecord.escalated); also clears the raise it repeats.
  bool escalation = 3;
}

// Sent only after the recipient has durably stored the listed alert revisions.
message AlertAck {
  string request_id = 1;
  repeated AlertAckEntry entries = 2;
  reserved 3 to 8;
}

// ---- Remote control (additive; monitoring controls only, no power/service/script actions) ----
// A ControlCommand rides the already authenticated PeerSession. It is additionally signed by the issuing peer's
// identity key over a canonical encoding (see docs/SECURITY.md) bound to issuer, target, session, validity window and
// payload; high-risk commands carry a second signature by the issuer's separately enrolled user-presence key.
enum ControlStatus {
  CONTROL_STATUS_UNSPECIFIED = 0;
  CONTROL_STATUS_APPLIED = 1;
  // Understood but not executed (authorization, validation, or target state); see reason_code.
  CONTROL_STATUS_REFUSED = 2;
  // Accepted but waiting for an explicit local approval on the target (presence-key enrollment).
  CONTROL_STATUS_PENDING_LOCAL_APPROVAL = 3;
}

message PauseCollection {
  // Empty pauses every collector; otherwise the collector/capability id (for example monitor.system).
  string capability_id = 1;
  // 0 pauses until resumed (or until the target restarts); otherwise the pause expires on its own.
  uint32 duration_seconds = 2;
}

message ResumeCollection {
  string capability_id = 1;
}

message SetSamplingInterval {
  // 0 clears the manual interval; otherwise within the target's bounds.
  uint32 interval_seconds = 1;
  // 0 keeps the manual interval until cleared; otherwise it reverts on its own.
  uint32 duration_seconds = 2;
}

message AcknowledgeAlert {
  string alert_id = 1;
}

message MuteAlerts {
  // Empty mutes every rule.
  string rule_id = 1;
  uint32 duration_seconds = 2;
}

message UnmuteAlerts {
  string rule_id = 1;
}

message ResolvePairing {
  string pairing_id = 1;
  // The fingerprint the phone displayed to its user; the target refuses when it no longer matches the request.
  bytes remote_public_key_sha256 = 2;
  bool approve = 3;
}

message EnrollPresenceKey {
  // P-256 SPKI of a key whose use requires biometric verification on the issuing device.
  bytes presence_public_key_spki = 1;
  // Presence-key signature over the canonical enrollment statement (proves possession and a working gate).
  bytes proof_of_possession = 2;
}

// Approves installation of the update the desktop has already downloaded, verified and staged. Bound to the exact
// version and artifact digest the phone displayed; the desktop refuses when its staged update no longer matches.
message ApproveUpdate {
  string version = 1;
  // SHA-256 of the staged artifact as listed in the signed update manifest (32 bytes).
  bytes artifact_sha256 = 2;
}

// Sets the issuing phone's own alert preferences on the alert-owning desktop (replaces its previous preferences). The
// recipient is always the authenticated issuer. Alerts filtered out are still recorded as events but not queued.
message SetAlertPreferences {
  // Lowest severity the phone wants; UNSPECIFIED (0) means everything.
  AlertSeverity min_severity = 1;
  // Rule ids (for example threshold.cpu_high) the phone opts out of entirely.
  repeated string muted_rule_kinds = 2;
}

// One alert rule override. rule_id is one of threshold.cpu_high, threshold.memory_high, threshold.disk_free
// (threshold in percent) or peer.silent (threshold in minutes). An absent threshold keeps the built-in default.
message AlertRuleOverride {
  string rule_id = 1;
  bool enabled = 2;
  optional double threshold = 3;
}

// Replaces the rule overrides for one subject peer on the alert-owning desktop (an empty list restores the built-in
// defaults). subject_peer_id is empty or the target itself for the CPU, memory and disk rules (the owner only evaluates its own
// signals) and the watched trusted peer for peer.silent. Changes what alerts fire for every recipient, so it is an elevated command.
message SetAlertRuleOverrides {
  string subject_peer_id = 1;
  repeated AlertRuleOverride overrides = 2;
}

// T059. High-risk: needs the power-control grant and a presence signature. Restarts the target once into entry_id
// (one-time next boot; the boot loader's default entry is never changed, so a failed boot falls back to it). An empty
// entry_id restarts into the default entry. The target refuses when its own BootConfiguration does not allow it.
message SwitchBootTarget {
  string entry_id = 1;
  // The title the issuer saw, re-checked by the target so a renumbered menu cannot boot the wrong OS.
  string expected_title = 2;
}

message ControlCommand {
  string command_id = 1;
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  string issuer_peer_id = 4;
  string target_peer_id = 5;
  string session_id = 6;
  bytes nonce = 7;
  oneof payload {
    PauseCollection pause_collection = 10;
    ResumeCollection resume_collection = 11;
    SetSamplingInterval set_sampling_interval = 12;
    AcknowledgeAlert acknowledge_alert = 13;
    MuteAlerts mute_alerts = 14;
    UnmuteAlerts unmute_alerts = 15;
    ResolvePairing resolve_pairing = 16;
    EnrollPresenceKey enroll_presence_key = 17;
    ApproveUpdate approve_update = 18;
    SetAlertPreferences set_alert_preferences = 19;
    SetAlertRuleOverrides set_alert_rule_overrides = 22;
    SwitchBootTarget switch_boot_target = 23;
  }
  // ECDSA P-256 (IEEE P1363) by the issuer's peer identity key over the canonical command encoding.
  bytes issuer_signature = 20;
  // Same canonical encoding signed by the issuer's user-presence key; required for elevated and high-risk commands.
  bytes presence_signature = 21;
}

message ControlResult {
  string command_id = 1;
  ControlStatus status = 2;
  // Stable machine-readable code ("applied", "expired", "presence_required", ...).
  string reason_code = 3;
  string safe_message = 4;
  google.protobuf.Timestamp decided_at = 5;
  // True when this is the stored result of an earlier identical command (idempotent resend).
  bool replayed = 6;
}

// Read-only: pending pairing requests the target desktop holds, for display on a trusted phone.
message PendingPairingsRequest {
  string request_id = 1;
}

message PendingPairingSummary {
  string pairing_id = 1;
  string remote_peer_id = 2;
  string display_name = 3;
  bytes remote_public_key_sha256 = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message PendingPairingsResponse {
  string request_id = 1;
  repeated PendingPairingSummary pairings = 2;
}

// Read-only: the desktop's update state, for display on a trusted phone that holds the update-approval grant.
message UpdateStatusRequest {
  string request_id = 1;
}

message UpdateStatusResponse {
  string request_id = 1;
  // False when this peer lacks the update-approval grant; every other field is then empty.
  bool permitted = 2;
  // False when the desktop has no update agent configured.
  bool available = 3;
  string installed_version = 4;
  // Empty unless an update is downloaded, verified and staged.
  string staged_version = 5;
  bytes staged_artifact_sha256 = 6;
  // Update lifecycle stage (for example Idle, Staged, Applying, Applied, Failed).
  string state = 7;
  string last_error = 8;
  // True when a staged update is waiting for approval and this desktop can install it.
  bool approval_pending = 9;
}

// Read-only: the authenticated caller's own alert preferences (never another peer's). Needs the monitoring-controls grant.
message AlertPreferencesRequest {
  string request_id = 1;
}

message AlertPreferencesResponse {
  string request_id = 1;
  // False when this peer lacks the monitoring-controls grant (or is not trusted); every other field is then empty.
  bool permitted = 2;
  // UNSPECIFIED (0) means everything (also the default when the caller never set preferences).
  AlertSeverity min_severity = 3;
  repeated string muted_rule_kinds = 4;
  // Unset when the caller never set preferences (the default applies).
  google.protobuf.Timestamp updated_at = 5;
}

// Read-only: the effective alert rules of the desktop (built-in defaults plus overrides). Needs the monitoring-controls grant.
message AlertRulesRequest {
  string request_id = 1;
}

message AlertRuleState {
  // Peer the rule applies to: the desktop itself for the CPU, memory and disk rules, a watched peer for peer.silent.
  string subject_peer_id = 1;
  string rule_id = 2;
  string title = 3;
  // "percent" or "minutes".
  string unit = 4;
  double default_threshold = 5;
  double threshold = 6;
  bool enabled = 7;
  bool overridden = 8;
  double minimum = 9;
  double maximum = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message AlertRulesResponse {
  string request_id = 1;
  // False when this peer lacks the monitoring-controls grant (or is not trusted); every other field is then empty.
  bool permitted = 2;
  repeated AlertRuleState rules = 3;
}

message PeerSessionRequest {
  oneof message {
    PeerHello hello = 1;
    PeerProof proof = 2;
    CapabilityExchange capability_exchange = 3;
    OriginRangeRequest origin_range_request = 4;
    OriginRecordBatch origin_batch = 5;
    OriginAck origin_ack = 6;
    PeerHeartbeat heartbeat = 7;
    LiveSubscribe live_subscribe = 20;
    LiveInterest live_interest = 21;
    LiveInterestAck live_interest_ack = 22;
    // Additive alert delivery (phone pulls, acks after a durable write). Fields 10-15 are reserved for it.
    AlertPull alert_pull = 8;
    AlertAck alert_ack = 9;
    ControlCommand control_command = 30;
    PendingPairingsRequest pending_pairings_request = 31;
    UpdateStatusRequest update_status_request = 32;
    AlertPreferencesRequest alert_preferences_request = 33;
    AlertRulesRequest alert_rules_request = 34;
  }
}

message PeerSessionResponse {
  oneof message {
    PeerHello hello = 1;
    PeerChallenge challenge = 2;
    CapabilityExchange capability_exchange = 3;
    OriginRangeRequest origin_range_request = 4;
    OriginRecordBatch origin_batch = 5;
    OriginAck origin_ack = 6;
    PeerHeartbeat heartbeat = 7;
    CompatibilityFailure incompatibility = 8;
    ProtocolError error = 9;
    PeerProof proof = 10;
    LiveSubscribeAck live_subscribe_ack = 20;
    LiveInterest live_interest = 21;
    LiveInterestAck live_interest_ack = 22;
    AlertBatch alert_batch = 11;
    ControlResult control_result = 30;
    PendingPairingsResponse pending_pairings_response = 31;
    UpdateStatusResponse update_status_response = 32;
    AlertPreferencesResponse alert_preferences_response = 33;
    AlertRulesResponse alert_rules_response = 34;
  }
}
