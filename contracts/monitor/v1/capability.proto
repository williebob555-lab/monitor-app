syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

import "google/protobuf/duration.proto";
import "monitor/v1/common.proto";

enum CapabilityModuleKind {
  CAPABILITY_MODULE_KIND_UNSPECIFIED = 0;
  CAPABILITY_MODULE_KIND_ORDINARY_MONITORING = 1;
  CAPABILITY_MODULE_KIND_DEFENSIVE_SECURITY = 2;
}

enum ObservationValueKind {
  OBSERVATION_VALUE_KIND_UNSPECIFIED = 0;
  OBSERVATION_VALUE_KIND_NUMERIC = 1;
  OBSERVATION_VALUE_KIND_COUNTER = 2;
  OBSERVATION_VALUE_KIND_STATE = 3;
  OBSERVATION_VALUE_KIND_EVENT = 4;
  OBSERVATION_VALUE_KIND_FACT = 5;
  OBSERVATION_VALUE_KIND_ERROR = 6;
  OBSERVATION_VALUE_KIND_TOPOLOGY_EVIDENCE = 7;
}

enum ObservationTemporalBehavior {
  OBSERVATION_TEMPORAL_BEHAVIOR_UNSPECIFIED = 0;
  OBSERVATION_TEMPORAL_BEHAVIOR_GAUGE = 1;
  OBSERVATION_TEMPORAL_BEHAVIOR_MONOTONIC_COUNTER = 2;
  OBSERVATION_TEMPORAL_BEHAVIOR_DISCRETE_STATE = 3;
  OBSERVATION_TEMPORAL_BEHAVIOR_POINT_EVENT = 4;
  OBSERVATION_TEMPORAL_BEHAVIOR_INVENTORY_FACT = 5;
}

enum ObservationImportance {
  OBSERVATION_IMPORTANCE_UNSPECIFIED = 0;
  OBSERVATION_IMPORTANCE_LOW = 1;
  OBSERVATION_IMPORTANCE_NORMAL = 2;
  OBSERVATION_IMPORTANCE_HIGH = 3;
  OBSERVATION_IMPORTANCE_CRITICAL = 4;
}

enum ObservationPrivacyClass {
  OBSERVATION_PRIVACY_CLASS_UNSPECIFIED = 0;
  OBSERVATION_PRIVACY_CLASS_OPERATIONAL = 1;
  OBSERVATION_PRIVACY_CLASS_SENSITIVE = 2;
  OBSERVATION_PRIVACY_CLASS_DEFENSIVE_SECURITY = 3;
}

enum ObservationCollectionCost {
  OBSERVATION_COLLECTION_COST_UNSPECIFIED = 0;
  OBSERVATION_COLLECTION_COST_LOW = 1;
  OBSERVATION_COLLECTION_COST_MEDIUM = 2;
  OBSERVATION_COLLECTION_COST_HIGH = 3;
}

enum NetworkDataClass {
  NETWORK_DATA_CLASS_UNSPECIFIED = 0;
  NETWORK_DATA_CLASS_NOT_NETWORK_DATA = 1;
  NETWORK_DATA_CLASS_AGGREGATE_OPERATIONAL = 2;
  NETWORK_DATA_CLASS_INFRASTRUCTURE_FACT = 3;
  NETWORK_DATA_CLASS_COMMUNICATION_IDENTITY = 4;
  NETWORK_DATA_CLASS_FLOW_OR_SESSION = 5;
  NETWORK_DATA_CLASS_DNS_OR_QUERY_HISTORY = 6;
  NETWORK_DATA_CLASS_PACKET_DETAIL = 7;
  NETWORK_DATA_CLASS_PER_APPLICATION_OR_PROCESS = 8;
  NETWORK_DATA_CLASS_CONTENT = 9;
}

enum InspectorKind {
  INSPECTOR_KIND_UNSPECIFIED = 0;
  INSPECTOR_KIND_GENERATED_FALLBACK = 1;
  INSPECTOR_KIND_PURPOSE_BUILT = 2;
}

message SemanticVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message EntityTypeDeclaration {
  string entity_type_id = 1;
  string display_name = 2;
}

message RelationshipTypeDeclaration {
  string relationship_type_id = 1;
  string source_entity_type_id = 2;
  string target_entity_type_id = 3;
}

message ObservationDeclaration {
  string signal_id = 1;
  string entity_type_id = 2;
  string domain = 3;
  string subsystem = 4;
  string source = 5;
  ObservationValueKind value_kind = 6;
  string unit = 7;
  ObservationTemporalBehavior temporal_behavior = 8;
  ObservationImportance importance = 9;
  ObservationPrivacyClass privacy = 10;
  ObservationCollectionCost collection_cost = 11;
  NetworkDataClass network_data_class = 12;
  google.protobuf.Duration default_sampling_interval = 13;
  google.protobuf.Duration stale_after = 14;
  google.protobuf.Duration default_retention = 15;
  bool requires_explicit_enablement = 16;
  bool requires_evidence = 17;
  bool requires_confidence = 18;
}

message InspectorDescriptor {
  string inspector_id = 1;
  string title = 2;
  InspectorKind kind = 3;
  repeated string signal_ids = 4;
}

message CapabilityModuleDeclaration {
  string module_id = 1;
  SemanticVersion module_version = 2;
  ProtocolCompatibility compatible_peer_protocol = 3;
  CapabilityModuleKind module_kind = 4;
  repeated EntityTypeDeclaration entity_types = 5;
  repeated ObservationDeclaration observations = 6;
  repeated RelationshipTypeDeclaration relationships = 7;
  repeated InspectorDescriptor inspectors = 8;
}
