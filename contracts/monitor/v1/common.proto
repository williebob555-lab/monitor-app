syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ProtocolCompatibility {
  uint32 minimum_major = 1;
  uint32 minimum_minor = 2;
  uint32 maximum_major = 3;
  uint32 maximum_minor = 4;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WINDOWS = 1;
  PLATFORM_FEDORA = 2;
  PLATFORM_UBUNTU = 3;
  PLATFORM_ANDROID = 4;
}

enum CapabilityState {
  CAPABILITY_STATE_UNSPECIFIED = 0;
  CAPABILITY_STATE_AVAILABLE = 1;
  CAPABILITY_STATE_UNSUPPORTED = 2;
  CAPABILITY_STATE_PERMISSION_DENIED = 3;
  CAPABILITY_STATE_DEGRADED = 4;
  CAPABILITY_STATE_ERROR = 5;
}

enum ObservationQuality {
  OBSERVATION_QUALITY_UNSPECIFIED = 0;
  OBSERVATION_QUALITY_VALID = 1;
  OBSERVATION_QUALITY_ESTIMATED = 2;
  OBSERVATION_QUALITY_UNAVAILABLE = 3;
  OBSERVATION_QUALITY_PERMISSION_DENIED = 4;
  OBSERVATION_QUALITY_ERROR = 5;
}

enum MetricUnit {
  METRIC_UNIT_UNSPECIFIED = 0;
  METRIC_UNIT_RATIO = 1;
  METRIC_UNIT_BYTES = 2;
  METRIC_UNIT_BYTES_PER_SECOND = 3;
  METRIC_UNIT_COUNT = 4;
  METRIC_UNIT_SECONDS = 5;
  METRIC_UNIT_CELSIUS = 6;
  METRIC_UNIT_BOOLEAN = 7;
  METRIC_UNIT_MEGABITS_PER_SECOND = 8;
}

message Capability {
  string id = 1;
  CapabilityState state = 2;
  string detail_code = 3;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_VERSION = 1;
  PROTOCOL_ERROR_CODE_INVALID_IDENTITY = 2;
  PROTOCOL_ERROR_CODE_INVALID_MESSAGE = 3;
  PROTOCOL_ERROR_CODE_SEQUENCE_CONFLICT = 4;
  PROTOCOL_ERROR_CODE_MESSAGE_TOO_LARGE = 5;
  PROTOCOL_ERROR_CODE_UNAUTHORIZED = 6;
  PROTOCOL_ERROR_CODE_INTERNAL = 7;
  // The requested origin range was removed by retention; resume from pruned_range.last_sequence + 1.
  PROTOCOL_ERROR_CODE_RANGE_PRUNED = 8;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string safe_message = 2;
  bool retryable = 3;
  // Set with RANGE_PRUNED: the exact origin sequence range the origin removed by retention.
  PrunedRange pruned_range = 4;
}

// An origin sequence range (inclusive) intentionally absent at the origin; replicas resume after last_sequence.
message PrunedRange {
  string origin_peer_id = 1;
  string origin_stream_id = 2;
  uint64 first_sequence = 3;
  uint64 last_sequence = 4;
}
