syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

import "google/protobuf/timestamp.proto";
import "monitor/v1/common.proto";

enum StatePlane {
  STATE_PLANE_UNSPECIFIED = 0;
  STATE_PLANE_ACTUAL = 1;
  STATE_PLANE_DESIGN = 2;
}

enum EvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_USER_ASSERTED = 1;
  EVIDENCE_KIND_REPORTED = 2;
  EVIDENCE_KIND_INFERRED = 3;
  EVIDENCE_KIND_IMPORTED = 4;
}

enum RelationshipDirection {
  RELATIONSHIP_DIRECTION_UNSPECIFIED = 0;
  RELATIONSHIP_DIRECTION_DIRECTED = 1;
  RELATIONSHIP_DIRECTION_UNDIRECTED = 2;
}

enum CableDirectionality {
  CABLE_DIRECTIONALITY_UNSPECIFIED = 0;
  CABLE_DIRECTIONALITY_REVERSIBLE = 1;
  CABLE_DIRECTIONALITY_DIRECTIONAL = 2;
  CABLE_DIRECTIONALITY_CONVERSION = 3;
}

enum ConnectorForm {
  CONNECTOR_FORM_UNSPECIFIED = 0;
  CONNECTOR_FORM_PLUG = 1;
  CONNECTOR_FORM_SOCKET = 2;
  CONNECTOR_FORM_NEUTRAL = 3;
}

enum ConnectorRole {
  CONNECTOR_ROLE_UNSPECIFIED = 0;
  CONNECTOR_ROLE_BIDIRECTIONAL = 1;
  CONNECTOR_ROLE_SOURCE = 2;
  CONNECTOR_ROLE_DESTINATION = 3;
}

message DesignScope {
  string project_id = 1;
  string scenario_id = 2;
  string revision_id = 3;
}

message AssertionProvenance {
  string source = 1;
  EvidenceKind evidence_kind = 2;
  ObservationQuality quality = 3;
  bool has_confidence = 4;
  double confidence = 5;
  repeated string evidence_reference_ids = 6;
}

message ProductIdentity {
  string manufacturer = 1;
  string model_number = 2;
  string variant = 3;
}

message SellerOfferIdentity {
  string seller_id = 1;
  string seller_offer_key = 2;
  string product_object_id = 3;
}

message PhysicalInstanceIdentity {
  string instance_key = 1;
  string serial_number = 2;
  string product_object_id = 3;
  string acquired_from_offer_object_id = 4;
}

message DesignPlaceholderIdentity {
  string placeholder_key = 1;
}

message GenericActualIdentity {
  string authority = 1;
  string stable_key = 2;
}

message UniversalObjectEnvelope {
  string object_id = 1;
  string object_type_id = 2;
  string display_name = 3;
  StatePlane plane = 4;
  DesignScope design_scope = 5;
  AssertionProvenance provenance = 6;
  google.protobuf.Timestamp valid_from = 7;
  google.protobuf.Timestamp valid_to = 8;
  repeated string tags = 9;

  oneof identity {
    ProductIdentity product = 10;
    SellerOfferIdentity offer = 11;
    PhysicalInstanceIdentity instance = 12;
    DesignPlaceholderIdentity design_placeholder = 13;
    GenericActualIdentity generic_actual = 14;
  }
}

message TypedRelationship {
  string relationship_id = 1;
  string relationship_type_id = 2;
  string source_object_id = 3;
  string target_object_id = 4;
  RelationshipDirection direction = 5;
  StatePlane plane = 6;
  DesignScope design_scope = 7;
  AssertionProvenance provenance = 8;
  google.protobuf.Timestamp valid_from = 9;
  google.protobuf.Timestamp valid_to = 10;
}

message ConnectorEnd {
  string connector_standard_id = 1;
  ConnectorForm form = 2;
  ConnectorRole role = 3;
}

message UnitLength {
  double value = 1;
  string unit = 2;
}

message CableSpecification {
  string object_id = 1;
  ConnectorEnd end_a = 2;
  ConnectorEnd end_b = 3;
  CableDirectionality directionality = 4;
  UnitLength nominal_length = 5;
  UnitLength measured_length = 6;
  google.protobuf.Timestamp measured_at = 7;
  string measurement_method = 8;
}

message UniversalInventorySnapshot {
  repeated UniversalObjectEnvelope objects = 1;
  repeated TypedRelationship relationships = 2;
  repeated CableSpecification cables = 3;
}
