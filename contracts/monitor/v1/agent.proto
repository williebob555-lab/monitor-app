syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

import "google/protobuf/timestamp.proto";
import "monitor/v1/common.proto";
import "monitor/v1/enrollment.proto";
import "monitor/v1/telemetry.proto";

service AgentService {
  rpc AgentSession(stream AgentSessionRequest) returns (stream AgentSessionResponse);
}

message AgentHello {
  ProtocolVersion protocol_version = 1;
  string agent_id = 2;
  string boot_id = 3;
  string agent_version = 4;
  Platform platform = 5;
  repeated Capability capabilities = 6;
  uint64 lowest_pending_sequence = 7;
  uint64 next_sequence = 8;
}

message CapabilityUpdate {
  repeated Capability capabilities = 1;
}

message AgentHeartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

message AgentSessionProof {
  string agent_id = 1;
  string session_id = 2;
  string challenge_id = 3;
  SignatureAlgorithm signature_algorithm = 4;
  // A fixed-width 64-byte IEEE P1363 signature (r || s) for v1.
  bytes proof_signature = 5;
}

message AgentSessionRequest {
  oneof message {
    AgentHello hello = 1;
    TelemetryBatch telemetry = 2;
    CapabilityUpdate capability_update = 3;
    AgentHeartbeat heartbeat = 4;
    AgentSessionProof proof = 5;
  }
}

message AgentSessionChallenge {
  string agent_id = 1;
  string session_id = 2;
  string challenge_id = 3;
  bytes proof_challenge = 4;
  SignatureAlgorithm signature_algorithm = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message ControllerHello {
  ProtocolVersion protocol_version = 1;
  string session_id = 2;
  uint64 accepted_through_sequence = 3;
  uint32 maximum_batch_count = 4;
  uint32 maximum_batch_bytes = 5;
  google.protobuf.Timestamp server_time = 6;
}

message TelemetryAck {
  uint64 accepted_through_sequence = 1;
}

message AgentSessionResponse {
  oneof message {
    ControllerHello hello = 1;
    TelemetryAck telemetry_ack = 2;
    ProtocolError error = 3;
    AgentSessionChallenge challenge = 4;
  }
}
