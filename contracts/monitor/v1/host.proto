syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

import "google/protobuf/timestamp.proto";

// T058/T059. Published by every node about itself as a signed origin record (signal "host.descriptor") on start and
// whenever a field changes. Viewers use hardware_id only as a hint to suggest linking OS installs of one machine; it
// never grants trust.
message HostDescriptor {
  // Lowercase hex SHA-256("monitorapp-machine-v1|" + SMBIOS system UUID). Empty when unavailable or all-zero.
  string hardware_id = 1;
  // "windows" or "linux".
  string os_family = 2;
  // e.g. "Fedora Linux 43 (Workstation Edition)", "Windows 11 Pro".
  string os_name = 3;
  string os_version = 4;
  string host_name = 5;
  string boot_id = 6;
  google.protobuf.Timestamp booted_at = 7;
  BootConfiguration boot = 8;
  // Lowercase colon-separated MACs of physical interfaces that support Wake-on-LAN, for waking a machine that is off.
  repeated string wake_mac_addresses = 9;
}

enum BootSwitchSupport {
  BOOT_SWITCH_SUPPORT_UNSPECIFIED = 0;
  // A one-time next boot into any listed entry is possible from this OS (Linux: GRUB with GRUB_DEFAULT=saved and a
  // writable grubenv reachable by the privileged helper).
  BOOT_SWITCH_SUPPORT_ONE_TIME = 1;
  // Only a plain restart is possible from this OS; the machine then boots its default entry.
  BOOT_SWITCH_SUPPORT_RESTART_TO_DEFAULT_ONLY = 2;
  // Not possible; unsupported_reason says why (no GRUB found, GRUB_DEFAULT is not "saved", grubenv unreachable,
  // privileged helper not installed).
  BOOT_SWITCH_SUPPORT_UNSUPPORTED = 3;
}

message BootEntry {
  // Stable identifier passed back in SwitchBootTarget (GRUB menu entry id or title as grub-reboot accepts it).
  string entry_id = 1;
  string title = 2;
  // "windows", "linux" or "other", detected from the entry.
  string os_family = 3;
  // True for the entry GRUB boots when no one-time choice is set. Never changed by this app.
  bool is_default = 4;
  // True for the entry this OS was booted from, when known.
  bool is_current = 5;
}

message BootConfiguration {
  // "grub", "windows-boot-manager", "unknown".
  string boot_loader = 1;
  BootSwitchSupport support = 2;
  string unsupported_reason = 3;
  repeated BootEntry entries = 4;
}
