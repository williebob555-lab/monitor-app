syntax = "proto3";

package monitor.v1;

option csharp_namespace = "MonitorApp.Contracts.V1";

import "google/protobuf/timestamp.proto";
import "monitor/v1/common.proto";

message MetricValue {
  oneof value {
    double double_value = 1;
    sint64 signed_integer_value = 2;
    uint64 unsigned_integer_value = 3;
    bool boolean_value = 4;
    string string_value = 5;
  }
}

message MetricSample {
  string metric_id = 1;
  string component_id = 2;
  MetricUnit unit = 3;
  ObservationQuality quality = 4;
  MetricValue value = 5;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFORMATION = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
}

message TelemetryEvent {
  string event_type = 1;
  EventSeverity severity = 2;
  string component_id = 3;
  string summary = 4;
}

message CollectorStatus {
  string capability_id = 1;
  CapabilityState state = 2;
  string detail_code = 3;
}

message TelemetryEnvelope {
  string agent_id = 1;
  string boot_id = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp ingested_at = 5;
  string collector_id = 6;

  oneof payload {
    MetricSample metric = 10;
    TelemetryEvent event = 11;
    CollectorStatus collector_status = 12;
  }
}

message TelemetryBatch {
  repeated TelemetryEnvelope envelopes = 1;
}
