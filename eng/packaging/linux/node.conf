# Monitor App peer node configuration (systemd EnvironmentFile: KEY=value, no quotes/export).
# The local administration page is ALWAYS loopback-only and cannot be configured here.
#
# The peer listener defaults to 127.0.0.1 (no remote peers can connect). To accept peers on
# the tailnet/LAN, set an EXPLICIT address of this host. Do not use 0.0.0.0 unless you
# intend to expose the peer port on every interface and have firewalled it.
#MONITOR_APP_PEER_BIND=100.64.0.10
#MONITOR_APP_PEER_PORT=55431
#MONITOR_APP_ADMIN_PORT=55432
#
# Apply with: systemctl restart monitor-app
