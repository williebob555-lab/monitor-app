# Monitor App collector for a Linux server. Steps: README.md in this folder.
services:
  monitor:
    build:
      context: .
      args:
        VERSION: ${VERSION:-latest}
    image: monitor-app-collector
    container_name: monitor-app
    restart: unless-stopped
    init: true
    # Host network: the collector must see this server's real network cards,
    # its Tailscale address, and Syncthing on 127.0.0.1:22000. Nothing is
    # published or listened on.
    network_mode: host
    # Write files as you, so Syncthing (running as you) can manage them.
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MONITOR_NAME: ${NAME:-}
      # Optional, with the docker-list service below: this host's containers.
      # DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      - ${MONITOR_FOLDER:?set MONITOR_FOLDER in .env to the shared Monitor folder}:/monitor
      - ./data:/data
      - /etc/os-release:/etc/os-release:ro
      # The host's time zone, so history files and "busiest in the evening"
      # use your local time instead of UTC.
      - /etc/localtime:/etc/localtime:ro
      # Optional: readings from a USB audio interface. Docker hides the
      # host's sound card details; this shares them read-only.
      # - /proc/asound:/host/asound:ro
      # Optional: a UPS that UPower on the host reads, shared as one small
      # read-only file by packaging/linux/upower-export.sh ("UPS through
      # UPower" in README.md). No D-Bus and no USB device in here. Keep the
      # folder OUTSIDE ./data (or any folder mounted writable here), so the
      # collector can never change it. create_host_path: false makes the
      # start fail instead of mounting an empty stand-in when the storage
      # isn't mounted yet; selinux: z lets the container read it.
      # - type: bind
      #   source: /var/lib/monitor-app/upower
      #   target: /host/upower
      #   read_only: true
      #   bind: { create_host_path: false, selinux: z }
      # Optional: disk health from the host's SMART timer ("Disk health" in
      # README.md), read-only.
      # - type: bind
      #   source: /var/lib/monitor-app/smart
      #   target: /host/smart
      #   read_only: true
      #   bind: { create_host_path: false, selinux: z }
    # Optional: a USB UPS (charge, mains or battery, load, runtime), read
    # directly. Needs the one udev rule in README.md first, and the UPS
    # plugged in when the container starts.
    # devices: ["/dev/monitor-ups:/dev/monitor-ups:r"]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  # Optional: lets the collector see this host's containers (state, health,
  # CPU, memory, ports), and nothing else. The collector never gets the
  # Docker socket; this proxy holds it and answers only GET requests under
  # /containers (list and stats). Everything else, including every POST
  # (start, stop, exec, create), is refused. Listens on 127.0.0.1 only.
  # To use: remove the #s here and on DOCKER_HOST above, then
  # docker compose up -d.
  # docker-list:
  #   image: tecnativa/docker-socket-proxy:v0.5.0
  #   container_name: monitor-app-docker-list
  #   restart: unless-stopped
  #   environment:
  #     CONTAINERS: 1
  #     POST: 0
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   ports: ["127.0.0.1:2375:2375"]
  #   read_only: true
  #   tmpfs: [/run, /tmp]
  #   security_opt: ["no-new-privileges:true"]
  #   # Fedora with SELinux: the socket needs this to be readable here.
  #   # security_opt: ["label=type:container_runtime_t", "no-new-privileges:true"]
