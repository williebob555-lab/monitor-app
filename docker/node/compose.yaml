# Monitor App peer node for a Linux test server. Usage and pairing: docker/README.md
services:
  node:
    build:
      context: .
      args:
        MONITOR_APP_VERSION: ${MONITOR_APP_VERSION:-0.1.35}
    image: monitor-app-node:${MONITOR_APP_VERSION:-0.1.35}
    container_name: monitor-app-node
    # Host networking is required: the admin page must stay on the HOST's 127.0.0.1:55432 (it refuses anything
    # that is not loopback), and the peer listener must bind the host's Tailscale address so phones and computers
    # on the tailnet can reach it. No ports are published, so nothing else is exposed.
    network_mode: host
    # Lets the node see the host's processes (Tailscale, Syncthing, Docker...) for service monitoring.
    # It runs as an unprivileged user with no capabilities, so it can see them but not touch them.
    pid: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m"]
    environment:
      # The host's Tailscale IPv4 address (run: tailscale ip -4). Without it the node only listens on loopback.
      MONITOR_APP_PEER_BIND: ${MONITOR_APP_PEER_BIND:?set MONITOR_APP_PEER_BIND in .env to this machine's Tailscale address (tailscale ip -4)}
      MONITOR_APP_PEER_PORT: ${MONITOR_APP_PEER_PORT:-55431}
      MONITOR_APP_ADMIN_PORT: ${MONITOR_APP_ADMIN_PORT:-55432}
      # Wilson's devices have no fingerprint/PIN; the node asks for confirmation in the app instead.
      MONITOR_APP_LOCAL_PRESENCE: ${MONITOR_APP_LOCAL_PRESENCE:-when-enrolled}
    volumes:
      # Node identity, database and logs. A plain folder next to this file so logs are easy to read and copy:
      #   ./data/logs/diagnostics-YYYY-MM-DD.log
      - ./data:/var/lib/monitor-app:Z
      # Host facts the collectors read (read-only).
      - /etc/os-release:/etc/os-release:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
