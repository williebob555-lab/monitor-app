name: Signed alpha release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: monitor-app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve immutable release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.tag }}'
          } else {
              '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
              throw 'Release tag must use vMAJOR.MINOR.PATCH.'
          }
          git rev-parse --verify "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
          if ((git rev-list -n 1 $tag) -ne (git rev-parse HEAD)) {
              throw 'Workflow source revision does not match the release tag.'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "published_at=$(git show -s --format=%cI $tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view '${{ steps.release.outputs.tag }}' *> $null
          if ($LASTEXITCODE -eq 0) {
              throw 'The release already exists and will not be overwritten.'
          }
          $global:LASTEXITCODE = 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify source before packaging
        shell: pwsh
        run: ./eng/verify.ps1

      - name: Publish self-contained alpha artifacts
        shell: pwsh
        run: |
          ./eng/release/Publish-AlphaArtifacts.ps1 `
              -Version '${{ steps.release.outputs.version }}' `
              -OutputDirectory 'artifacts'

      - name: Verify packaging preserved tracked source
        shell: pwsh
        run: git diff --exit-code

      - name: Record Android release gate
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'src/MonitorApp.Android/MonitorApp.Android.csproj') {
              'Android project exists, but APK signing and device validation remain a separate required release job.' >> $env:GITHUB_STEP_SUMMARY
          } else {
              'Android artifact omitted: the Android project and signed APK release gate do not exist yet.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Create signed update manifest
        env:
          MONITOR_UPDATE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.MONITOR_UPDATE_SIGNING_KEY_PKCS8_BASE64 }}
          MONITOR_UPDATE_SIGNING_KEY_ID: ${{ vars.MONITOR_UPDATE_SIGNING_KEY_ID }}
          MONITOR_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ vars.MONITOR_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
        shell: pwsh
        run: |
          dotnet run `
              --project eng/release/MonitorApp.ReleaseTool/MonitorApp.ReleaseTool.csproj `
              -c Release `
              -- create `
              --version '${{ steps.release.outputs.version }}' `
              --minimum-compatible-version '0.1.0' `
              --channel 'alpha' `
              --published-at '${{ steps.release.outputs.published_at }}' `
              --artifacts-dir 'artifacts' `
              --base-url 'https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/' `
              --output 'artifacts/update-manifest.json'

      - name: Create human-verifiable checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath artifacts -File |
              Where-Object Name -ne 'SHA256SUMS' |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              } | Set-Content -LiteralPath artifacts/SHA256SUMS -Encoding utf8NoBOM

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath artifacts -File | ForEach-Object FullName
          gh release create '${{ steps.release.outputs.tag }}' $files `
              --verify-tag `
              --generate-notes `
              --title 'Monitor App ${{ steps.release.outputs.tag }}'
