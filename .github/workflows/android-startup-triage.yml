name: Android release APK startup smoke

# Build a release-mode, test-signed APK from the PR, then launch it on an Android emulator.
# A successful build alone cannot detect an Activity theme or first-frame startup crash.
# Old .NET app: manual only since Monitor App 2.0 replaced it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PACKAGE_ID: app.monitor.selfhosted
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Android emulator image
        run: |
          set -euo pipefail
          # Runner images often have Android SDK installed, but cmdline-tools is not on PATH.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          avdmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name avdmanager -print -quit 2>/dev/null || true)"
          if [ -z "$sdkmanager_path" ] || [ -z "$avdmanager_path" ]; then
            echo "Downloading Android SDK command-line tools (runner image does not include them)."
            mkdir -p "$sdk_root/cmdline-tools"
            curl --fail --location --retry 3 --output /tmp/android-cmdline.zip \
              'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            unzip -q /tmp/android-cmdline.zip -d /tmp/android-cmdline
            mv /tmp/android-cmdline/cmdline-tools "$sdk_root/cmdline-tools/monitor-smoke"
            sdkmanager_path="$sdk_root/cmdline-tools/monitor-smoke/bin/sdkmanager"
            avdmanager_path="$sdk_root/cmdline-tools/monitor-smoke/bin/avdmanager"
          fi
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          # Give avdmanager and emulator one explicit, deterministic location.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/monitor-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$sdkmanager_path" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager_path" --sdk_root="$sdk_root" --install \
            'system-images;android-35;google_apis;x86_64' 'emulator' 'platform-tools' \
            'platforms;android-36' 'build-tools;36.0.0'
          echo "no" | "$avdmanager_path" create avd --name monitor-smoke \
            --package 'system-images;android-35;google_apis;x86_64' --force
          "$avdmanager_path" list avd
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/monitor-smoke.ini" || {
            echo "::error::AVD initialization failed to write the expected monitor-smoke.ini file."
            exit 1
          }
          sudo chmod 666 /dev/kvm || true

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build release-mode APK with disposable CI signing key
        env:
          SMOKE_KEY_PASS: ci-smoke-key-only
        run: |
          set -euo pipefail
          # Isolated, throwaway key; it is never uploaded, published or provisioned on devices.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/monitor-smoke.jks" \
            -alias monitor-smoke -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$SMOKE_KEY_PASS" -keypass "$SMOKE_KEY_PASS" \
            -dname "CN=Monitor App Emulator Smoke,O=CI"
          dotnet restore src/MonitorApp.Android/MonitorApp.Android.csproj --locked-mode \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:JavaSdkDirectory="$JAVA_HOME_21_X64"
          dotnet publish src/MonitorApp.Android/MonitorApp.Android.csproj \
            -c Release -f net10.0-android36.0 --no-restore \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:JavaSdkDirectory="$JAVA_HOME_21_X64" \
            -p:AcceptAndroidSDKLicenses=true -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/monitor-smoke.jks" \
            -p:AndroidSigningKeyAlias=monitor-smoke \
            -p:AndroidSigningKeyPass=env:SMOKE_KEY_PASS \
            -p:AndroidSigningStorePass=env:SMOKE_KEY_PASS
          apk="$(find src/MonitorApp.Android/bin/Release -name '*-Signed.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "::error::No signed Release APK produced."; exit 1; }
          mkdir -p release
          cp "$apk" release/candidate.apk

      - name: Boot emulator and launch candidate APK
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$RUNNER_TEMP/monitor-avds}"
          emulator -avd monitor-smoke -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-metrics -memory 2048 > /tmp/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 120s adb wait-for-device || {
            tail -n 90 /tmp/emulator.log
            echo "::error::Emulator process failed to connect to adb."
            exit 1
          }
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 3
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || {
            tail -n 70 /tmp/emulator.log
            echo "::error::Android emulator failed to boot."
            exit 1
          }
          adb shell input keyevent 82
          echo "=== APK native ABIs ==="
          unzip -Z1 release/candidate.apk | grep '^lib/' | cut -d/ -f2 | sort -u || true
          adb install -r release/candidate.apk
          adb logcat -c
          adb shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1
          sleep 15
          adb logcat -d -v threadtime > /tmp/launch.log
          echo "=== Process ==="
          adb shell pidof "$PACKAGE_ID" || true
          echo "=== Fatal/managed exception evidence ==="
          grep -Ein -A 28 -B 4 'FATAL EXCEPTION|AndroidRuntime|libmonodroid.*(fail|error)|Unhandled Exception|System\.[A-Za-z]+Exception|Microsoft\.Maui|Avalonia.*Exception|SIGABRT|Fatal signal|Could not load' /tmp/launch.log | tail -n 200 || true
          if ! adb shell pidof "$PACKAGE_ID" >/dev/null; then
            echo "::error::The candidate Android application exits/crashes immediately after launch."
            exit 1
          fi
          echo "Release-mode candidate APK remained alive after startup."
